<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokopia Furniture Matcher</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Pokopia Furniture Matcher</h1>
        <p>Select Pokemon to Find Matching Furniture</p>
        <p>Data was sourced directly from <a href="https://www.serebii.net">Serebii</a></p>
        <button id="theme-toggle" class="theme-btn">Toggle Dark Mode</button>
    </header>

    <section id="selection-area">
    <div class="selector-container">
        <input class="pkmn-select" id="select-1" list="pokemon-options" placeholder="Search Pokemon 1...">
        <div id="info-1" class="pkmn-info"></div>
    </div>
    <div class="selector-container">
        <input class="pkmn-select" id="select-2" list="pokemon-options" placeholder="Search Pokemon 2...">
        <div id="info-2" class="pkmn-info"></div>
    </div>
    <div class="selector-container">
        <input class="pkmn-select" id="select-3" list="pokemon-options" placeholder="Search Pokemon 3...">
        <div id="info-3" class="pkmn-info"></div>
    </div>
    <div class="selector-container">
        <input class="pkmn-select" id="select-4" list="pokemon-options" placeholder="Search Pokemon 4...">
        <div id="info-4" class="pkmn-info"></div>
    </div>

    <datalist id="pokemon-options"></datalist>
</section>

    <main class="results-container">
        <div class="column" id="relaxation-col">
            <h2>Relaxation</h2>
            <div class="item-list" id="list-Relaxation"></div>
        </div>

        <div class="column" id="decoration-col">
            <h2>Decoration</h2>
            <div class="item-list" id="list-Decoration"></div>
        </div>

        <div class="column" id="toys-col">
            <h2>Toys</h2>
            <div class="item-list" id="list-Toy"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
